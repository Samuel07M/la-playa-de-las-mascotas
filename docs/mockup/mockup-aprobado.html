<title>Inventario — La Playa de las Mascotas</title>
<style>
:root{--bg:#f3f6fb;--sf:#fff;--tx:#1e293b;--mu:#64748b;--bd:#e5eaf2;--pr:#2563eb;--prt:#fff;--pl:#dbeafe;--pt:#1d4ed8;--sb:#3b78e7;--rd:#dc2626;--rl:#fee2e2;--am:#b45309;--al:#fef3c7;--gn:#15803d;--gl:#dcfce7;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}


html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--sb);color:#fff;padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;font-weight:700;line-height:1.2}
.brand img{width:48px;height:48px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 4px 10px rgba(15,35,90,.25);flex:none}.nl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:6px 12px 4px}
.nvb{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:12px;border:0;background:none;color:rgba(255,255,255,.92);font:inherit;font-weight:500;cursor:pointer;text-align:left;width:100%;transition:background .15s,transform .15s}.nv .ic{display:flex;width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.16);align-items:center;justify-content:center;flex:none;transition:background .15s}.nv .tx{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px}
.nv:hover{background:rgba(255,255,255,.14);transform:translateX(2px)}.nv.on{background:#fff;color:var(--pr);font-weight:600;box-shadow:0 4px 12px rgba(15,35,90,.22)}.nv.on .ic{background:var(--pl)}
.sf{margin-top:auto;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.25);font-size:12px;color:rgba(255,255,255,.8)}
.sf b{display:block;color:#fff;font-size:14px}
.main{overflow:auto;padding:26px 32px;background:#fff}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--mu);margin:0 0 18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(30,41,59,.06)}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar .in{flex:1;min-width:170px;width:auto}
.in{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}
.in:focus{outline:2px solid var(--pr);outline-offset:-1px}.in.bad{border-color:var(--rd)}
.b{padding:8px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;cursor:pointer}
.b:hover{background:var(--bg)}.b.pri{background:var(--pr);border-color:var(--pr);color:var(--prt);font-weight:600}.b.pri:hover{filter:brightness(1.1)}.b.dn{color:var(--rd)}.b:disabled{opacity:.45;cursor:not-allowed}
.wrap{overflow-x:auto}.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.tb td{padding:10px 8px;border-bottom:1px solid var(--bd);vertical-align:top}.tb tr.off td{opacity:.55}.tb tr.low td{background:var(--rl)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.ok{background:var(--gl);color:var(--gn)}.mu{background:var(--bg);color:var(--mu)}.rd{background:var(--rl);color:var(--rd)}.bl{background:var(--pl);color:var(--pt)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:1px 8px;font-size:12px;margin:3px 4px 0 0}
.chip button{border:0;background:none;color:var(--mu);cursor:pointer;padding:0}
.g2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:58vh;overflow:auto}
.pc{text-align:left;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);cursor:pointer;font:inherit}.pc:hover{border-color:var(--pr)}
.pc b{display:block}.pc span{color:var(--mu);font-size:12px}
.ln{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.qty{display:flex;align-items:center;gap:4px}.qty input{width:52px;text-align:center}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:14px 0}
.er{color:var(--rd);font-size:12px;display:block;margin-top:3px}
label{display:block;font-weight:600;margin-bottom:12px;font-size:13px}label .in{margin-top:4px;font-weight:400}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.alert{padding:10px 14px;border-radius:10px;margin-bottom:14px}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--sf);border-radius:14px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.md h3{margin:0 0 12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:10px 16px;border-radius:10px;color:#fff;background:#15803d;z-index:60;display:none;max-width:90%}#toast.e{background:#dc2626}
@media(max-width:980px){.g2{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--bd);padding:8px}.brand,.sf{display:none}.nvb{flex-direction:row}.nv{white-space:nowrap;width:auto;padding:8px 12px}.nv .ic{display:none}.nl{display:none}.main{padding:16px}}

<script>
const U='Isabel',CATS=['Alimento perros','Alimento gatos','Higiene','Accesorios','Snacks','Salud','Otros'];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('es-CO'),fd=d=>new Date(d).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const er=m=>m?`<small class="er">${m}</small>`:'';
const hd=(t,s,h)=>`<h1>${t}</h1><p class="sub">${s}</p>`;
function seed(){const D=864e5,n=Date.now(),s={p:[],m:[],sv:0};
 [['Concentrado Dog Chow Adulto 8kg','Alimento perros',62000,5,['dog chow','chow grande'],12],['Concentrado Gatsy Gatos 3kg','Alimento gatos',38000,4,['gatsy'],3],['Arena sanitaria 10kg','Higiene',24000,6,['arena'],15],['Collar antipulgas pequeño','Accesorios',18000,3,['collar'],8],['Snack Dentastix','Snacks',9500,10,['dentastix','palitos'],6],['Shampoo para perros 500ml','Higiene',21000,3,[],5],['Plato de acero inoxidable','Accesorios',12000,4,[],9],['Juguete hueso de goma','Accesorios',8000,3,[],4,0]].forEach((x,i)=>{
  s.p.push({id:i+1,n:x[0],c:x[1],pr:x[2],mn:x[3],a:x[4],on:x[6]!==0});s.m.push({pid:i+1,t:'entrada',q:x[5],mo:'Inventario inicial',ref:'INV-INICIAL',u:U,d:n-7*D})});
 s.m.push({pid:3,t:'venta',q:2,mo:'Efectivo',ref:'V-000',u:U,d:n-2*D},{pid:1,t:'baja',q:1,mo:'Vencido',ref:'',u:U,d:n-D});return s}
function load(){try{const r=localStorage.getItem('playa-s1');if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem('playa-s1',JSON.stringify(S))}catch(e){}}
let S=load(),view='cat',q='',sq='',cart=[],pay='Efectivo',t0=null,eref='',ent=[{pid:'',q:''}],eErr=null,bj={pid:'',q:'',mo:'',n:''},bErr={},mf={pid:'',from:'',to:''};
const stock=id=>S.m.reduce((a,x)=>x.pid==id?a+(x.t=='entrada'?x.q:-x.q):a,0),prod=id=>S.p.find(x=>x.id==id),act=()=>S.p.filter(p=>p.on),low=()=>act().filter(p=>stock(p.id)<p.mn);
const mov=(pid,t,q,mo,ref)=>S.m.push({pid:+pid,t,q:+q,mo,ref,u:U,d:Date.now()});
const tm=()=>{const s=t0?Math.floor((Date.now()-t0)/1e3):0;return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};

function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'e':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2800)}
function modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="md">${h}</div></div>`}
function closeM(){$('#modal').innerHTML=''}
function ask(m,fn){window._ok=fn;modal(`<h3>Confirmación</h3><p>${m}</p><div class="mf"><button class="b" onclick="closeM()">Cancelar</button><button class="b pri" onclick="closeM();_ok()">Confirmar</button></div>`)}
function reset(){ask('¿Restablecer los datos de ejemplo? Se borrarán los cambios hechos en esta simulación.',()=>{S=seed();save();cart=[];t0=null;toast('Datos restablecidos');render()})}

const IC={cat:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>`,sale:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg>`,ent:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>`,baj:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>`,inv:`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/></svg>`};
function render(){
 const N=[['cat','Catálogo','HU-01 · HU-02'],['sale','Nueva venta','HU-03'],['ent','Entradas','HU-04'],['baj','Bajas','HU-05'],['inv','Inventario','HU-06']],L=low().length;
 $('#nav').innerHTML=N.map(n=>`<button class="nv ${view==n[0]?'on':''}" onclick="go('${n[0]}')"><span class="ic">${IC[n[0]]}</span><span class="tx"><span>${n[1]}</span>${n[0]=='inv'&&L?`<span class="tag rd">${L}</span>`:''}</span></button>`).join('');
 $('#main').innerHTML=({cat:vCat,sale:vSale,ent:vEnt,baj:vBaj,inv:vInv})[view]();
 if(view=='cat')catList();if(view=='sale'){grid();cartR()}if(view=='inv')mvList()}
/* HU-01 / HU-02 */
function vCat(){return hd('Catálogo de productos','Crea, edita y desactiva productos; asigna alias.',['HU-01','HU-02'])+`<div class="bar"><input class="in" placeholder="Buscar por nombre, categoría o alias…" value="${esc(q)}" oninput="q=this.value;catList()"><button class="b pri" onclick="pForm()">+ Nuevo producto</button></div><div class="card wrap" id="cl"></div>`}
function catList(){const s=q.trim().toLowerCase(),base=p=>(p.n+' '+p.c).toLowerCase().includes(s);
 const r=S.p.map(p=>({p,h:s&&!base(p)?p.a.find(a=>a.toLowerCase().includes(s)):null})).filter(x=>!s||x.h||base(x.p));
 $('#cl').innerHTML=r.length?`<table class="tb"><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Mín.</th><th>Estado</th><th></th></tr>${r.map(({p,h})=>`<tr class="${p.on?'':'off'}"><td><b>${esc(p.n)}</b>${h?`<span class="er" style="color:var(--pr)">↳ coincide con el alias «${esc(h)}»</span>`:''}<div>${p.a.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div></td><td>${p.c}</td><td>${money(p.pr)}</td><td>${stock(p.id)}</td><td>${p.mn}</td><td><span class="tag ${p.on?'ok':'mu'}">${p.on?'Activo':'Inactivo'}</span></td><td style="white-space:nowrap"><button class="b" onclick="pForm(${p.id})">Editar</button> <button class="b" onclick="aForm(${p.id})">Alias</button> <button class="b" onclick="tog(${p.id})">${p.on?'Desactivar':'Activar'}</button></td></tr>`).join('')}</table>`:'<p class="sub">Sin resultados.</p>'}
function tog(id){const p=prod(id);p.on=!p.on;save();toast(p.on?'Producto activado':'Producto desactivado. Su historial se conserva.');render()}
const fld=(l,k,v,t,e)=>`<label>${l}<input id="f_${k}" type="${t}" class="in ${e?'bad':''}" value="${esc(v)}">${er(e)}</label>`;
function pForm(id,e={},v){const p=id?prod(id):{};v=v||{n:p.n||'',c:p.c||'',pr:p.pr??'',mn:p.mn??''};
 modal(`<h3>${id?'Editar producto':'Nuevo producto'}</h3>${fld('Nombre','n',v.n,'text',e.n)}<label>Categoría<select id="f_c" class="in ${e.c?'bad':''}"><option value="">Seleccionar…</option>${CATS.map(c=>`<option ${c==v.c?'selected':''}>${c}</option>`).join('')}</select>${er(e.c)}</label>${fld('Precio de venta (COP)','pr',v.pr,'number',e.pr)}${fld('Stock mínimo (unidades)','mn',v.mn,'number',e.mn)}<div class="mf"><button class="b" onclick="closeM()">Cancelar</button><button class="b pri" onclick="pSave(${id||0})">Guardar</button></div>`)}
function pSave(id){const g=k=>$('#f_'+k).value.trim(),v={n:g('n'),c:g('c'),pr:g('pr'),mn:g('mn')},e={};
 if(!v.n)e.n='El nombre es obligatorio.';if(!v.c)e.c='Selecciona una categoría.';
 if(v.pr===''||!(+v.pr>0))e.pr='El precio debe ser mayor que 0.';
 if(v.mn===''||!Number.isInteger(+v.mn)||+v.mn<0)e.mn='Indica un stock mínimo entero (0 o más).';
 if(Object.keys(e).length)return pForm(id,e,v);
 if(id)Object.assign(prod(id),{n:v.n,c:v.c,pr:+v.pr,mn:+v.mn});else S.p.push({id:Math.max(0,...S.p.map(p=>p.id))+1,n:v.n,c:v.c,pr:+v.pr,mn:+v.mn,a:[],on:true});
 save();closeM();toast(id?'Producto actualizado en todo el sistema':'Producto creado');render()}
function aForm(id,err='',val=''){const p=prod(id);modal(`<h3>Alias de «${esc(p.n)}»</h3><p class="sub">Nombres con los que Alirio y Olga llaman al producto.</p><div style="margin-bottom:12px">${p.a.map((a,i)=>`<span class="chip">${esc(a)} <button onclick="aDel(${id},${i})" title="Quitar">✕</button></span>`).join('')||'<span class="sub">Sin alias aún.</span>'}</div><label>Nuevo alias<input id="f_a" class="in ${err?'bad':''}" value="${esc(val)}" onkeydown="if(event.key=='Enter')aAdd(${id})">${er(err)}</label><div class="mf"><button class="b" onclick="closeM();render()">Cerrar</button><button class="b pri" onclick="aAdd(${id})">Agregar</button></div>`)}
function aAdd(id){const v=$('#f_a').value.trim();if(!v)return aForm(id,'Escribe un alias.');
 const o=S.p.find(p=>p.a.some(a=>a.toLowerCase()==v.toLowerCase()));if(o)return aForm(id,`Ese alias ya pertenece a «${esc(o.n)}».`,v);
 prod(id).a.push(v);save();toast('Alias agregado');aForm(id)}
function aDel(id,i){prod(id).a.splice(i,1);save();aForm(id)}
/* HU-03 */
function vSale(){return hd('Nueva venta','Selecciona productos, cantidades y método de pago.',['HU-03'])+`<div class="g2"><div class="card"><input class="in" placeholder="Buscar producto o alias…" value="${esc(sq)}" oninput="sq=this.value;grid()" style="margin-bottom:12px"><div class="pg" id="sg"></div></div><div class="card" id="cart"></div></div>`}
function grid(){const s=sq.trim().toLowerCase();$('#sg').innerHTML=act().filter(p=>!s||(p.n+' '+p.c+' '+p.a.join(' ')).toLowerCase().includes(s)).map(p=>`<button class="pc" onclick="add(${p.id})"><b>${esc(p.n)}</b><span>${money(p.pr)} · stock ${stock(p.id)}</span></button>`).join('')||'<p class="sub">Sin resultados.</p>'}
function add(id){const r=cart.find(x=>x.pid==id);r?r.q++:cart.push({pid:id,q:1});if(!t0)t0=Date.now();cartR()}
function setQ(i,v){cart[i].q=Math.max(1,parseInt(v)||1);cartR()}
function cartR(){const tot=cart.reduce((a,r)=>a+r.q*prod(r.pid).pr,0);
 $('#cart').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><b>Venta actual</b><span class="tag mu" id="tm">⏱ ${tm()} · meta &lt; 4:00</span></div>`+(cart.length?cart.map((r,i)=>{const p=prod(r.pid),s=stock(r.pid);return `<div class="ln"><div><b>${esc(p.n)}</b><small style="color:var(--mu)">${money(p.pr)} c/u</small>${r.q>s?`<span class="er">⚠ Supera el stock disponible (${s}).</span>`:''}</div><div class="qty"><button class="b" onclick="setQ(${i},${r.q-1})">−</button><input class="in" value="${r.q}" onchange="setQ(${i},this.value)"><button class="b" onclick="setQ(${i},${r.q+1})">+</button></div><b>${money(r.q*p.pr)}</b><button class="b dn" onclick="cart.splice(${i},1);if(!cart.length)t0=null;cartR()">✕</button></div>`}).join(''):'<p class="sub" style="margin-top:12px">Toca un producto para agregarlo.</p>')+`<div class="tot"><span>Total</span><span>${money(tot)}</span></div><div class="row2">${['Efectivo','Digital'].map(m=>`<button class="b ${pay==m?'pri':''}" onclick="pay='${m}';cartR()">${m}</button>`).join('')}</div><button class="b pri" style="width:100%;padding:12px" ${cart.length?'':'disabled'} onclick="sell()">Confirmar venta</button>`}
function sell(){const o=cart.filter(r=>r.q>stock(r.pid));o.length?ask('Estos productos superan el stock disponible: '+o.map(r=>esc(prod(r.pid).n)).join(', ')+'. ¿Confirmas la venta de todos modos?',doSell):doSell()}
function doSell(){const t=tm(),ref='V-'+String(S.sv=(S.sv||0)+1).padStart(3,'0');cart.forEach(r=>mov(r.pid,'venta',r.q,pay,ref));save();cart=[];t0=null;toast(`Venta ${ref} registrada en ${t}. Stock actualizado.`);render()}
/* HU-04 */
function vEnt(){const E=eErr||{l:[]},gr={};S.m.filter(x=>x.t=='entrada'&&x.ref!='INV-INICIAL').forEach(x=>(gr[x.ref]=gr[x.ref]||[]).push(x));const rec=Object.entries(gr).reverse().slice(0,5);
 return hd('Entrada de mercancía','Registra lo recibido con su factura o remisión.',['HU-04'])+`<div class="card" style="max-width:720px"><label>Referencia de factura o remisión<input class="in ${E.r?'bad':''}" value="${esc(eref)}" placeholder="Ej: FAC-1042" oninput="eref=this.value">${er(E.r)}</label>${ent.map((l,i)=>`<div class="ln" style="grid-template-columns:1fr 100px auto"><div><select class="in ${E.l[i]?'bad':''}" onchange="ent[${i}].pid=this.value"><option value="">Producto…</option>${act().map(p=>`<option value="${p.id}" ${p.id==l.pid?'selected':''}>${esc(p.n)}</option>`).join('')}</select>${er(E.l[i])}</div><input class="in" type="number" placeholder="Cant." value="${esc(l.q)}" oninput="ent[${i}].q=this.value"><button class="b dn" onclick="ent.length>1&&ent.splice(${i},1);eErr=null;render()">✕</button></div>`).join('')}<div class="mf" style="justify-content:space-between;margin-top:14px"><button class="b" onclick="ent.push({pid:'',q:''});render()">+ Agregar otro producto</button><button class="b pri" onclick="eSave()">Registrar entrada</button></div></div><div class="card" style="max-width:720px"><b>Últimas entradas</b>${rec.map(([r,a])=>`<div class="ln" style="grid-template-columns:90px 1fr auto"><b>${esc(r)}</b><span>${a.map(x=>esc(prod(x.pid).n)+' ×'+x.q).join(', ')}</span><small>${fd(a[0].d)}</small></div>`).join('')||'<p class="sub">Aún no hay entradas registradas.</p>'}</div>`}
function eSave(){const E={l:[]};let bad=false;if(!eref.trim()){E.r='La referencia es obligatoria.';bad=true}
 ent.forEach((l,i)=>{const p=l.pid&&prod(l.pid),n=+l.q;if(!p)E.l[i]='Selecciona un producto existente.';else if(!Number.isInteger(n)||n<=0)E.l[i]='La cantidad debe ser un entero mayor que 0.';if(E.l[i])bad=true});
 if(bad){eErr=E;toast('Revisa los campos marcados',1);return render()}
 ent.forEach(l=>mov(l.pid,'entrada',l.q,'Recepción',eref.trim()));save();const n=ent.length;eref='';ent=[{pid:'',q:''}];eErr=null;toast(`Entrada registrada (${n} producto${n>1?'s':''}). Stock actualizado.`);render()}
/* HU-05 */
function vBaj(){const E=bErr,B=bj,bs=S.m.filter(x=>x.t=='baja').reverse(),sm={};bs.forEach(x=>{const k=sm[x.mo]=sm[x.mo]||{q:0,v:0};k.q+=x.q;k.v+=x.q*prod(x.pid).pr});
 return hd('Bajas de mercancía','Descuenta stock por vencimiento, daño u otro motivo.',['HU-05'])+`<div class="g2"><div class="card"><label>Producto<select class="in ${E.p?'bad':''}" onchange="bj.pid=this.value"><option value="">Seleccionar…</option>${act().map(p=>`<option value="${p.id}" ${p.id==B.pid?'selected':''}>${esc(p.n)} (stock ${stock(p.id)})</option>`).join('')}</select>${er(E.p)}</label><label>Cantidad<input class="in ${E.q?'bad':''}" type="number" value="${esc(B.q)}" oninput="bj.q=this.value">${er(E.q)}</label><label>Motivo<select class="in ${E.m?'bad':''}" onchange="bj.mo=this.value"><option value="">Seleccionar…</option>${['Vencido','Dañado','Otro'].map(m=>`<option ${m==B.mo?'selected':''}>${m}</option>`).join('')}</select>${er(E.m)}</label><label>Detalle (opcional)<input class="in" value="${esc(B.n)}" oninput="bj.n=this.value"></label><button class="b pri" style="width:100%;padding:11px" onclick="bSave()">Registrar baja</button></div><div class="card"><b>Pérdidas por motivo</b><small style="color:var(--mu);display:block">Valoradas a precio de venta</small>${Object.entries(sm).map(([k,v])=>`<div class="ln" style="grid-template-columns:1fr auto auto"><span class="tag rd" style="justify-self:start">${esc(k)}</span><span>${v.q} u.</span><b>${money(v.v)}</b></div>`).join('')||'<p class="sub">Sin bajas registradas.</p>'}</div></div><div class="card wrap"><b>Historial de bajas</b><table class="tb"><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th>Motivo</th><th>Usuario</th></tr>${bs.map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(prod(x.pid).n)}</td><td>${x.q}</td><td>${esc(x.mo)}${x.ref?' · '+esc(x.ref):''}</td><td>${x.u}</td></tr>`).join('')}</table></div>`}
function bSave(){const e={},p=bj.pid&&prod(bj.pid),n=+bj.q;
 if(!p)e.p='Selecciona un producto.';if(!bj.mo)e.m='Debes seleccionar un motivo para guardar.';
 if(!Number.isInteger(n)||n<=0)e.q='La cantidad debe ser un entero mayor que 0.';else if(p&&n>stock(p.id))e.q=`La cantidad supera el stock actual (${stock(p.id)}).`;
 bErr=e;if(Object.keys(e).length){toast('No se pudo registrar la baja',1);return render()}
 mov(p.id,'baja',n,bj.mo,bj.n.trim());save();bj={pid:'',q:'',mo:'',n:''};bErr={};toast('Baja registrada. Stock actualizado.');render()}
/* HU-06 */
function vInv(){const L=low(),rows=act().map(p=>({p,s:stock(p.id)})).sort((a,b)=>(b.s<b.p.mn)-(a.s<a.p.mn)||a.p.n.localeCompare(b.p.n));
 return hd('Inventario','Stock actual, alertas e historial de movimientos.',['HU-06'])+(L.length?`<div class="alert rd">⚠ ${L.length} producto${L.length>1?'s':''} por debajo del stock mínimo: ${L.map(p=>esc(p.n)).join(', ')}.</div>`:`<div class="alert ok">✓ Todos los productos están por encima del mínimo.</div>`)+`<div class="card wrap"><table class="tb"><tr><th>Producto</th><th>Categoría</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th></th></tr>${rows.map(({p,s})=>`<tr class="${s<p.mn?'low':''}"><td><b>${esc(p.n)}</b></td><td>${p.c}</td><td><b>${s}</b></td><td>${p.mn}</td><td>${s<p.mn?'<span class="tag rd">Reabastecer</span>':'<span class="tag ok">OK</span>'}</td><td><button class="b" onclick="mf.pid=${p.id};render();$('#mvc').scrollIntoView({behavior:'smooth'})">Ver movimientos</button></td></tr>`).join('')}</table></div><div class="card" id="mvc"><b>Historial de movimientos</b><div class="bar" style="margin:10px 0"><select class="in" onchange="mf.pid=this.value;mvList()"><option value="">Todos los productos</option>${S.p.map(p=>`<option value="${p.id}" ${p.id==mf.pid?'selected':''}>${esc(p.n)}</option>`).join('')}</select><input class="in" type="date" value="${mf.from}" onchange="mf.from=this.value;mvList()"><input class="in" type="date" value="${mf.to}" onchange="mf.to=this.value;mvList()"></div><div class="wrap" id="mv"></div></div>`}
function mvList(){const f=mf.from?new Date(mf.from+'T00:00').getTime():0,t=mf.to?new Date(mf.to+'T23:59:59').getTime():Infinity,T={entrada:'ok',venta:'bl',baja:'rd'};
 const r=S.m.filter(x=>(!mf.pid||x.pid==mf.pid)&&x.d>=f&&x.d<=t).sort((a,b)=>b.d-a.d);
 let v='';if(mf.pid){const sm=S.m.reduce((a,x)=>x.pid==mf.pid?a+(x.t=='entrada'?x.q:-x.q):a,0),s=stock(mf.pid);v=`<div class="alert ${sm==s?'ok':'rd'}">Entradas − ventas − bajas = <b>${sm}</b> · Stock mostrado = <b>${s}</b> ${sm==s?'✓ coinciden':'✗ no coinciden'}</div>`}
 $('#mv').innerHTML=v+(r.length?`<table class="tb"><tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Motivo / referencia</th><th>Usuario</th></tr>${r.map(x=>`<tr><td>${fd(x.d)}</td><td>${esc(prod(x.pid).n)}</td><td><span class="tag ${T[x.t]}">${x.t}</span></td><td><b>${x.t=='entrada'?'+':'−'}${x.q}</b></td><td>${esc(x.mo)}${x.ref?' · '+esc(x.ref):''}</td><td>${x.u}</td></tr>`).join('')}</table>`:'<p class="sub">Sin movimientos para ese filtro.</p>')}
render();
</script></body></html>
